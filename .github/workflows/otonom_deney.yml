name: Otonom Mavi Kırmızı Deneyi

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Mavi ve Kırmızı Döngüsünü Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python mavi_kirmizi.py

      - name: Değişiklikleri Depoya Kaydet
        run: |
          git config --global user.name "Otonom-Mavi-Kirmizi-Bot"
          git config --global user.email "bot@github.com"
          git add counter.txt sari_sistem.py
          git diff --staged --quiet || (git commit -m "Otonom Geliştirme Adımı Tamamlandı" && git push)
          
