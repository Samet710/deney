name: Otonom Evrim

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI SDK
        run: python -m pip install --upgrade openai

      - name: Blue proposes a gameplay evolution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python mavi.py

      - name: Red validates and decides
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python kirmizi.py

      - name: Export the exact Yellow model to Pages
        run: python sari_sistem.py --export-web

      - name: Clean ephemeral proposal files
        run: rm -f mavi_aday.json kirmizi_sonuc.json

      - name: Commit accepted generation / dashboard data
        run: |
          git config user.name "Autonom-Mavi-Kirmizi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sari_sistem.py history.json counter.txt docs/data.json
          if git diff --cached --quiet; then
            echo "No accepted change to commit."
            exit 0
          fi
          git commit -m "autonom: evolve yellow game"
          git push
