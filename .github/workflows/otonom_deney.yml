name: Otonom Mavi Kırmızı Deneyi


on:

  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"
      timezone: "Europe/Istanbul"


permissions:

  contents: write
  pages: write
  id-token: write


concurrency:

  group: otonom-mavi-kirmizi
  cancel-in-progress: false


jobs:

  run-experiment:

    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:


      - name: Depoyu Çek

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Python Ortamını Kur

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Test Ortamını Kur

        run: |

          python -m pip install --upgrade pip

          pip install pytest


      - name: Mavi ve Kırmızı Döngüsünü Çalıştır

        env:

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |

          python mavi_kirmizi.py


      - name: Sarı Sistemini Pages'e Kopyala

        run: |

          mkdir -p docs

          cp sari_sistem.py docs/sari_sistem.py


      - name: Değişiklikleri Depoya Kaydet

        run: |

          git config user.name \
            "Otonom-Mavi-Kirmizi-Bot"

          git config user.email \
            "bot@github.com"


          git add \
            sari_sistem.py \
            counter.txt \
            history.json \
            docs/data.json


          if git diff --staged --quiet; then

            echo "Kaydedilecek değişiklik yok."

          else

            git commit \
              -m "Otonom Geliştirme Adımı"

            git push

          fi


      - name: GitHub Pages Ayarla

        uses: actions/configure-pages@v5


      - name: Pages Artifact Oluştur

        uses: actions/upload-pages-artifact@v4

        with:
          path: "./docs"


      - name: GitHub Pages Yayınla

        id: deployment

        uses: actions/deploy-pages@v4
