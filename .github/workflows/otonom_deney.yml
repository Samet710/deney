name: Otonom Evrim + Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  evolve-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------
      # 1. REPOSITORY
      # --------------------------------------------------

      - name: Depoyu Al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. PYTHON
      # --------------------------------------------------

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # 3. GEREKLİ PAKETLER
      # --------------------------------------------------

      - name: Gerekli Python Paketlerini Kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai pytest


      # --------------------------------------------------
      # 4. MAVİ SİSTEM
      # --------------------------------------------------

      - name: Mavi Sistemi Çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python mavi.py


      # --------------------------------------------------
      # 5. KIRMIZI SİSTEM
      # --------------------------------------------------

      - name: Kırmızı Sistemi Çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python kirmizi.py


      # --------------------------------------------------
      # 6. SARI SİSTEM TESTLERİ
      # --------------------------------------------------

      - name: Sarı Sistem Testleri
        run: |
          python -m pytest -q test_sari.py


      # --------------------------------------------------
      # 7. PAGES VERİSİNİ ÜRET
      # --------------------------------------------------

      - name: Pages Verisini Üret
        run: |
          python sari_sistem.py --export-web


      # --------------------------------------------------
      # 8. GITHUB PAGES AYARLA
      # --------------------------------------------------

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5


      # --------------------------------------------------
      # 9. PAGES ARTIFACT
      # --------------------------------------------------

      - name: Pages Artifact Oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"


      # --------------------------------------------------
      # 10. GITHUB PAGES YAYINLA
      # --------------------------------------------------

      - name: GitHub Pages Yayınla
        id: deployment
        uses: actions/deploy-pages@v4


      # --------------------------------------------------
      # 11. GEÇİCİ DOSYALARI TEMİZLE
      # --------------------------------------------------

      - name: Geçici Dosyaları Temizle
        run: |
          rm -f mavi_aday.json
          rm -f kirmizi_sonuc.json


      # --------------------------------------------------
      # 12. GIT DURUMU
      # --------------------------------------------------

      - name: Git Durumunu Göster
        run: |
          git status --short


      # --------------------------------------------------
      # 13. DEĞİŞİKLİKLERİ KAYDET
      # --------------------------------------------------

      - name: Değişiklikleri Depoya Kaydet
        run: |
          git config user.name "Autonom-Mavi-Kirmizi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sari_sistem.py
          git add history.json
          git add counter.txt
          git add docs/data.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "autonom: evolve yellow game"
          git push
