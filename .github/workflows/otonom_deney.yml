name: Otonom Mavi Kırmızı Deneyi

on:
  workflow_dispatch:

  schedule:
    - cron: "*/20 * * * *"


permissions:
  contents: write


jobs:

  run-experiment:

    runs-on: ubuntu-latest

    steps:

      - name: Depoyu Çek

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Python Ortamını Kur

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Test Ortamini Kur

        run: |
          python -m pip install --upgrade pip
          pip install pytest


      - name: Mavi ve Kırmızı Döngüsünü Çalıştır

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

        run: |
          python mavi_kirmizi.py


      - name: Değişiklikleri Depoya Kaydet

        run: |

          git config user.name \
            "Otonom-Mavi-Kirmizi-Bot"

          git config user.email \
            "bot@github.com"

          git add \
            sari_sistem.py \
            counter.txt \
            attempts.txt

          if git diff --staged --quiet; then

            echo "Kaydedilecek değişiklik yok."

          else

            git commit \
              -m "Otonom Geliştirme Adımı"

            git push

          fi
