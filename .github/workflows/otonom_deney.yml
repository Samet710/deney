name: Otonom Evrim + Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  evolve-and-deploy:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      # -----------------------------------------------
      # REPOSITORY
      # -----------------------------------------------

      - name: Depoyu Al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------------
      # PYTHON
      # -----------------------------------------------

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # -----------------------------------------------
      # PAKETLER
      # -----------------------------------------------

      - name: Gerekli Python Paketlerini Kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai pytest


      # -----------------------------------------------
      # MAVİ
      # -----------------------------------------------

      - name: Mavi Sistemi Çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python mavi.py


      # -----------------------------------------------
      # KIRMIZI
      # -----------------------------------------------

      - name: Kırmızı Sistemi Çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python kirmizi.py


      # -----------------------------------------------
      # SARI TESTLERİ
      # -----------------------------------------------

      - name: Sarı Sistem Testleri
        run: |
          python -m pytest -q test_sari.py


      # -----------------------------------------------
      # PAGES VERİSİ
      # -----------------------------------------------

      - name: Pages Verisini Üret
        run: |
          python sari_sistem.py --export-web


      # -----------------------------------------------
      # PAGES AYARLARI
      # -----------------------------------------------

      - name: GitHub Pages Ayarla
        uses: actions/configure-pages@v5


      # -----------------------------------------------
      # PAGES ARTIFACT
      # -----------------------------------------------

      - name: Pages Artifact Oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"


      # -----------------------------------------------
      # PAGES DEPLOY
      # -----------------------------------------------

      - name: GitHub Pages Yayınla
        id: deployment
        uses: actions/deploy-pages@v4


      # -----------------------------------------------
      # GEÇİCİ DOSYALAR
      # -----------------------------------------------

      - name: Geçici Dosyaları Temizle
        run: |
          rm -f mavi_aday.json
          rm -f kirmizi_sonuc.json


      # -----------------------------------------------
      # GIT DURUMU
      # -----------------------------------------------

      - name: Git Durumunu Göster
        run: |
          git status --short


      # -----------------------------------------------
      # COMMIT
      # -----------------------------------------------

      - name: Değişiklikleri Depoya Kaydet
        run: |
          git config user.name "Autonom-Mavi-Kirmizi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sari_sistem.py
          git add history.json
          git add counter.txt
          git add docs/data.json

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 0
          fi

          git commit -m "autonom: evolve yellow game"

          git push
